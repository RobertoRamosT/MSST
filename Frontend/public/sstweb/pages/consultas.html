<!--container-->
<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6 lo-central" id="containerWelcome">
            <h4 id="tituloSaludo" style='font-weight:bold'>Gestor Online de Seguridad y Salud en el Trabajo</h4>
            <div id="logoVistaConsulta"><img src="../imagenes/logoVertical.png" style="width:200px;heigth:210px"></div>
            <br>

            <form id="formBuscarEmpresa" class="form-signin" style="display: none"  accept-charset="utf-8">
                <div class="col-md-2"></div>
                <div class="col-md-8">
                    <h2 class="form-signin-heading fo-head-lo">Ingrese RUC de la empresa a consultar</h2>
                    <input type="text" id="inputEmpresaRucBuscar" class="form-control" placeholder="Ej: 0123456789"
                           required="true" autofocus="true">
                    <button class="btn btn-lg btn-primary btn-block" id="btnBuscarEmpresa" type="submit">Buscar</button>
                </div>
                <div class="col-md-12" id="msj" class="msgWarning"></div>
            </form>

            <form id="formNeutral" class="form-signin" accept-charset="utf-8">
                <div class="col-md-2"></div>
                <div class="col-md-8">
                    <h2 class="form-signin-heading fo-head-lo">Accediendo a plataforma<i class="fa fa-spin"></i></h2>
                </div>
            </form>

            <form id="formBuscarQR" class="form-signin" accept-charset="utf-8">
            </form>
        </div>
    </div> <!-- /row -->
</div> <!-- /container full -->
