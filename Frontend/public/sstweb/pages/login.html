                    <button id="btnVerLoginEstandar" onclick="verLoginEstandar()" class="btn btn-primary btn-block campos-login_directorio_activo" type="button" style="font-size:18px;display:none;">Cargando...</button>
                    <input id="inputUser" type="text" class="form-control campos-login" placeholder="Nombre de Usuario" required="true" autofocus="true" style="display:none;">
<!--                    <label for="inputPassword" class="sr-only">Password</label>-->

                    <a id="enlaceVerContrasenia" class="efectoLink campos-login" onclick="verContraseniaLogin()" style="display:none;"><i class="fa fa-eye"></i> Ver contraseña</a>
                    
                    <button id="btnLogin" class="btn btn-lg btn-primary btn-block campos-login" type="button" style="display:none;">Cargando...</button>

<!--                    <a href="recuperar.html">¿Olvidó su contraseña?</a>-->

                    <a id="enlaceAswan" class="efectoLink" target="_blank" href="https://www.aswan.pe" style="display:none;"><i class="fa fa-external-link"></i> CONOZCA MÁS SOBRE GOSST</a>
