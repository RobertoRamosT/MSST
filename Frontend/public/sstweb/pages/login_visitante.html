	<!--container-->
   <div class="container" >
      <div class="row">
	     <div class="col-md-3"></div>
         <div class="col-md-6 lo-central" id="containerWelcome">   
	        <h4 id="tituloSaludo" style='font-weight:bold'>Gestor Online de Seguridad y Salud en el Trabajo</h4>
	        <div id="logoLoginVisitante"><img src="../imagenes/logoVertical.png" style="width:200px;heigth:210px"></div>
	        <br>
	        
	        <form id="formBuscarEmpresa" class="form-signin" accept-charset="utf-8" >
	      	<div class="col-md-2"></div>
	      	<div class="col-md-8">
		        <h2 class="form-signin-heading fo-head-lo">Ingrese RUC de la empresa a la que está visitando</h2>
 
		        <input type="text" id="inputEmpresaRucBuscar" class="form-control" placeholder="Ej: 0123456789" required="true" autofocus="true">
 
		        <button class="btn btn-lg btn-primary btn-block" id="btnBuscarEmpresa"  type="submit">Buscar </button>
			</div> 
	        <div class="col-md-12" id="msj" class="msgWarning" ></div>
	      </form>
	       <form id="formNeutral" class="form-signin" accept-charset="utf-8" >
	      	 <div class="col-md-2"></div>
			<div class="col-md-8">
		        <h2 class="form-signin-heading fo-head-lo">Accediendo a plataforma <i class="fa fa-spin"></i></h2>
  
			</div>
			 
	      </form>
	      <form id="formIngresarDni" class="form-signin" accept-charset="utf-8" >
	      	 <div class="col-md-2"></div>
			<div class="col-md-8"> 
 
		        <div class="form-container" >
		        <label for="inputIngresarRuc">Ingrese el RUC de la empresa para la que labora</label>
		        <input type="text" id="inputIngresarRuc" class="form-control"placeholder=" Ej: 1020304050">
		        
		        </div>
 
  			 <div class="form-container">
		        <label for="inputIngresarDni">Ingrese su DNI</label>
		        <input type="text" id="inputIngresarDni" class="form-control" placeholder=" Ej: 12345678" >
		        
		        </div>
 
		        <button class="btn btn-lg btn-primary btn-block"  type="submit">Ingresar </button>
			</div>
			  <div class="col-md-12" id="msgIngresarDni" class="msgWarning" ></div>
	      </form>
	      
	        
	      
	        <form id="formIngresarTipoVisitante" class="form-signin" accept-charset="utf-8" >
	      	 <div class="col-md-2"></div>
			<div class="col-md-8"  >
		       <div class="form-container" id="divSelectTipoVisitante">
		        <label for="selTipoVisitante">Relación con la empresa a la que visita o presta servicio</label>
		        
		        </div>
 
		        <button class="btn btn-lg btn-primary btn-block"  type="submit">Ingresar </button>
			</div>
			  <div class="col-md-12" id="msgIngresarDni" class="msgWarning" ></div>
	      </form>
	      
	      <form id="formNuevoVisitante" class="form-signin" accept-charset="utf-8" >
	         <div class="col-md-2"></div>
	      	 <div class="col-md-8">
	      	    <div class="form-container">
		           <div class="form-container">
		              <label for="inputDni">DNI</label>
		              <input type="text" id="inputDni" class="form-control" placeholder=" " >
		           </div>
		        
		           <label for="inputApellidoPaterno">Primer Apellido</label>
		           <input type="text" id="inputApellidoPaterno" class="form-control" placeholder=" ">
		        </div>
		        
		        <div class="form-container">
		           <label for="inputApellidoMaterno">Segundo Apellido</label>
		           <input type="text" id="inputApellidoMaterno" class="form-control" placeholder=" ">
		        </div>
	      	
		        <div class="form-container">
		           <label for="inputNombre">Nombres</label>
		           <input type="text" id="inputNombre" class="form-control" placeholder=" ">
		        </div>
		        
		        <div class="form-container">
		           <label for="inputCorreo">Correo</label>
		           <input type="text" id="inputCorreo" class="form-control" placeholder=" ">
		        </div>
 				 
 				<div class="form-container">
		           <label for="inputEmpresa">Empresa en la que trabaja</label>
		           <input type="text" id="inputEmpresa" class="form-control" placeholder=" ">
		        </div>
		         
		        <div class="form-container">
		           <label for="inputEmpresaRuc">RUC de la empresa en la que trabaja 
		              <span style="color:blue;">(opcional)</span>
		           </label>
		           <input type="text" id="inputEmpresaRuc" class="form-control" placeholder=" ">
		        </div>
		   <!-- <div class="form-container" id="divSelectTipoVisitante">
		           <label for="selTipoVisitante">Relación con la empresa a la que visita o presta servicio</label>
		        </div> -->
		        
		        <div class="form-container" id="divSelectPerfilVisitante">
		           <label for="selPerfilVisitante">Perfil</label>
		        </div>
 
		        <button class="btn btn-lg btn-primary btn-block" type="submit">Continuar</button>
			 </div> 
	         
	         <div class="col-md-12" id="msgNuevoVisitante" class="msgWarning" ></div>
	      </form>
	        </div>
